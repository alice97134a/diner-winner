<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚吃什麼？</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>今晚吃什麼？</h1>
    </header>
    
    <main>
        <div class="container">
            <p>點擊按鈕隨機選擇或選擇餐點類型：</p>
            <button class="random-btn" onclick="chooseDinner()">隨機選擇</button>
            <button class="category-btn" onclick="chooseDinner('中式')">中式</button>
            <button class="category-btn" onclick="chooseDinner('日式')">日式</button>
            <button class="category-btn" onclick="chooseDinner('義式')">義式</button>
            <button class="category-btn" onclick="chooseDinner('美式')">美式</button>
            <button class="category-btn" onclick="chooseDinner('健康選擇')">健康選擇</button>
            <button class="category-btn" onclick="chooseDinner('韓式')">韓式</button>
            <button class="category-btn" onclick="chooseDinner('越式')">越式</button>
            <button class="category-btn" onclick="chooseDinner('臺灣料理')">臺灣料理</button>
            <button class="category-btn" onclick="chooseDinner('法式')">法式</button>
            <button class="category-btn" onclick="chooseDinner('吃到飽')">吃到飽</button>
            <p id="result"></p>
        </div>
    </main>

    <script src="scripts.js"></script>
    
</body>
</html>

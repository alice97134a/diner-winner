<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚吃什麼？ 🍽️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #444;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            color: white;
        }
        .random-btn { background-color: #7a9e9f; }
        .category-btn { background-color: #ff9a8b; }
        #result {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
            color: #444;
        }

<body>

    <h1>🍽️ 今晚吃什麼？</h1>
    <div class="container">
        <p>點擊按鈕隨機選擇或選擇餐點類型：</p>
        <button class="random-btn" onclick="chooseDinner()">🎲 隨機選擇</button>
        <button class="category-btn" onclick="chooseDinner('中式')">🥢 中式</button>
        <button class="category-btn" onclick="chooseDinner('日式')">🍣 日式</button>
        <button class="category-btn" onclick="chooseDinner('義式')">🍝 義式</button>
        <button class="category-btn" onclick="chooseDinner('美式')">🍔 美式</button>
        <button class="category-btn" onclick="chooseDinner('健康選擇')">🥗 健康選擇</button>
        <button class="category-btn" onclick="chooseDinner('韓式')">🌶️ 韓式</button>
        <button class="category-btn" onclick="chooseDinner('越式')">🍜 越式</button>
        <button class="category-btn" onclick="chooseDinner('泰式')">🇹🇭 泰式</button>
        <button class="category-btn" onclick="chooseDinner('法式')">🇫🇷 法式</button>
        <button class="category-btn" onclick="chooseDinner('湯鍋')">🍲 湯鍋類</button>
        <button class="category-btn" onclick="chooseDinner('速食')">🏪 速食品牌</button>
        <button class="category-btn" onclick="chooseDinner('甜點')">🍰 甜點</button>
        <button class="category-btn" onclick="chooseDinner('飲料')">☕ 飲料</button>

            "健康選擇": ["🥗 沙拉", "🍗🔥 烤雞胸",　"🥣 燕麥粥",　"🥦🥕 蔬菜湯",　"🍽️ 豆腐料理",　"🥜🥛 堅果優格",　"🥗🍚 藜麥沙拉",　"🥪 全麥三明治",　"🥬🍏 綠色果昔",　"🥚 水煮蛋",　"🥑🍞 酪梨吐司",　"🍣🌱 全素壽司",　"🥬🍹 綠拿鐵",　"🍯🥣 希臘優格碗"],

            "湯鍋": ["🐑🍲 羊肉爐", "🌶️🐔 花椒雞", "🥢🐷 豬肚雞", "🐟🍲 酸菜魚 + 白飯", "🌶️🍲 泡菜豆腐湯", "🍵🐷 老火煲湯", "🍲🥢 佛跳牆", "🐟🍲 砂鍋魚頭", "🧄🍲 奶油洋蔥湯", "🌶️🥣 酸辣湯", "🍲🦞 龍蝦湯"],

            "甜點": ["🍰 提拉米蘇", "🍪 馬卡龍", "🧋 珍珠奶茶", "🍫 巧克力蛋糕"],
            "飲料": ["☕ 咖啡", "🍵 茶", "🥤 碳酸飲料", "🍹 調酒"]
            "吃到飽": ["🔥 燒肉吃到飽", "🍰 甜點吃到飽", "🍤 炸物吃到飽", "🍣 壽司吃到飽", "🦞 海鮮吃到飽", "🍽️ 自助餐"]
        };

        function chooseDinner(category = null) {
            let chosenCategory;

            // If a category is selected, use it; otherwise, pick a random category
            if (category && dinnerOptions.hasOwnProperty(category)) {
                chosenCategory = category;
            } else {
                const allCategories = Object.keys(dinnerOptions);
                chosenCategory = allCategories[Math.floor(Math.random() * allCategories.length)];
            }

            // Pick a random item from the chosen category
            const choices = dinnerOptions[chosenCategory];
            const dinnerChoice = choices[Math.floor(Math.random() * choices.length)];

            // Display the result
            document.getElementById("result").innerText = `今晚吃：${dinnerChoice}`;
        }
    </script>

</body>
</html>

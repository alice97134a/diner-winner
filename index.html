<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What to Eat Tonight 🍽️</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode { background-color: #111; color: #eee; }
    .light-mode { background-color: #fff; color: #111; }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
      color: white;
    }
    .random-btn { background-color: #7a9e9f; }
    .category-btn { background-color: #ff9a8b; }
    .mode-btn { background-color: #444; }
    .lang-btn { background-color: #666; }
    #result {
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      body { padding: 20px; }
      button { width: 100%; margin: 5px 0; }
    }
  </style>
</head>
<body class="dark-mode">
  <h1 id="title">🍽️ What to Eat Tonight?</h1>
  <button class="mode-btn" onclick="toggleMode()">🌓</button>
  <button class="lang-btn" onclick="toggleLang()">🌐</button>

  <div class="container">
    <p id="desc">Tap a button to randomly choose or pick a category:</p>
    <button class="random-btn" onclick="chooseDinner()">🎲 Random</button>
    <div id="category-buttons"></div>
    <p id="result"></p>
  </div>

          Japanese: ["Sushi", "Ramen", "Curry Rice"],
          Italian: ["Pasta", "Pizza", "Risotto"],
          American: ["Burger", "Fried Chicken", "BBQ Ribs"],
          Healthy: ["Salad", "Grilled Chicken Breast", "Tofu Dishes"],
          Korean: ["Korean Fried Chicken", "Bibimbap", "Kimchi Stew"],
          Thai: ["Green Curry", "Tom Yum Soup", "Pad Thai"],
          French: ["Coq au Vin", "Beef Bourguignon", "Ratatouille"],

          Baked: ["Croissant", "Baguette", "Pancakes"],
          FastFood: ["McDonald's", "Pizza Pizza", "Tim Hortons"],

          Drinks: ["Coffee", "Tea", "Soda"],
          Buffet: ["BBQ Buffet", "Seafood Buffet", "Sushi Buffet"],

        }
      },
      zh: {
        title: "🍽️ 今晚吃什麼？",
        desc: "點擊按鈕隨機選擇，或選擇餐點類型：",
        buttonText: "🎲 隨機選擇",
        categories: {
          中式: ["🍚 炒飯", "🍜 紅燒牛肉麵", "🌶️ 麻婆豆腐", "🍚 滷肉飯", "🥟 水餃", "🥢 宮保雞丁 + 白飯", "🌶️🍛 麻婆豆腐 + 白飯", "🍚🥚 滷肉飯 + 半熟蛋", "🍲🐮 紅燒牛肉飯", "🍚🔥 煲仔飯（滑雞 / 臘味）", "🍚🥬 上海菜飯", "🍲🐟 生滾粥（皮蛋瘦肉粥 / 海鮮粥）", "🍖🍚 新疆手抓飯", "🐔🧄 白斬雞 + 薑蔥醬", "🍍🐷 咕嚕肉（糖醋里肌）", "🍚🐷 扣肉飯", "🍖🍚 東坡肉飯", "🍚🍖 燒臘飯（叉燒 / 燒鴨 / 燒肉）", "🍜🐮 紅燒牛肉麵", "🍝🥒 炸醬麵", "🍜🔪 刀削麵", "🍜🥩 炒碼麵", "🍗🍝 新疆大盤雞 + 拌麵", "🌶️🍜 擔擔麵", "🦞🍜 龍蝦伊麵", "🍜🍳 上海粗炒", "🍜🥢 麵線糊", "🥢🐜 螞蟻上樹（粉絲炒肉末）", "🍜🌶️ 桂林米粉", "🌶️🍜 螺螄粉", "🥩🔥 牛仔骨（烤 / 燒汁）", "🍖🥯 東北烤羊肉串 + 烤饅頭片", "🍗🔥 烤雞翅", "🦑🔥 烤魷魚", "🌿🔥 烤韭菜", "🍆🔥 烤茄子", "🦆🔥 北京烤鴨", "🐷🔥 蜜汁叉燒", "🌶️🐔 口水雞", "🧄🥩 蔥爆牛肉", "🦐🔥 鹽酥蝦"],
          日式: ["壽司", "拉麵", "咖哩飯"],
          義式: ["義大利麵", "披薩", "燉飯"],
          美式: ["漢堡", "炸雞", "BBQ 烤肉"],
          健康選擇: ["沙拉", "烤雞胸", "豆腐料理"],
          韓式: ["韓式炸雞", "石鍋拌飯", "泡菜鍋"],
          泰式: ["泰式綠咖哩", "冬蔭功", "Pad Thai"],
          法式: ["紅酒燉雞", "法式燉牛肉", "普羅旺斯燉菜"],
          小食: ["水餃", "包子", "餛飩"],
          烘培: ["可頌", "法棍", "鬆餅"],
          速食: ["麥當勞", "Pizza Pizza", "Tim Hortons"],
          甜點: ["提拉米蘇", "馬卡龍", "珍珠奶茶"],
          飲料: ["咖啡", "茶", "汽水"],
          吃到飽: ["燒肉吃到飽", "甜點吃到飽", "壽司吃到飽"],
          義大利麵: ["番茄義大利麵", "奶油培根麵", "青醬麵"],
          新鮮體驗: ["阿根廷烤肉", "巴西烤肉", "Laksa"]
        }
      }
    };  
 
    let currentLang = "en";

    function renderText() {
      document.getElementById("title").textContent = data[currentLang].title;
      document.getElementById("desc").textContent = data[currentLang].desc;
      document.querySelector(".random-btn").textContent = data[currentLang].buttonText;
      renderButtons();
    }

    function renderButtons() {
      const categoryButtons = document.getElementById("category-buttons");
      categoryButtons.innerHTML = "";
      const categories = data[currentLang].categories;
      for (let key in categories) {
        const btn = document.createElement("button");
        btn.className = "category-btn";
        btn.textContent = key;
        btn.onclick = () => chooseDinner(key);
        categoryButtons.appendChild(btn);
      }
    }

    function chooseDinner(category) {
      const items = category ? data[currentLang].categories[category] : Object.values(data[currentLang].categories).flat();
      const pick = items[Math.floor(Math.random() * items.length)];
      document.getElementById("result").textContent = pick;
    }

    function toggleLang() {
      currentLang = currentLang === "en" ? "zh" : "en";
      renderText();
    }

    function toggleMode() {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    }

    renderText();
  </script>
</body>
</html>

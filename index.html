<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dinner Picker 🍽️</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #000;
      color: #fff;
    }
    .light-mode {
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      transition: background-color 0.3s;
    }
    .dark-mode .container {
      background: #1c1c1c;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .light-mode .container {
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
      color: white;
    }
    .random-btn { background-color: #7a9e9f; }
    .category-btn { background-color: #ff9a8b; }
    .mode-btn { background-color: #444; }
    .lang-btn { background-color: #5c6bc0; }

    #result {
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body class="dark-mode">
  <h1 id="title">🍽️ What’s for Dinner?</h1>
  <button class="mode-btn" onclick="toggleMode()">🌓 Toggle Theme</button>
  <button class="lang-btn" onclick="toggleLang()">🌐 中 / EN</button>

  <div class="container">
    <p id="subtitle">Tap to randomly choose or pick a category:</p>
    <button class="random-btn" onclick="chooseDinner()">🎲 Random</button>
    <button class="category-btn" onclick="chooseDinner('Fast Food')">🍔 Fast Food</button>
    <button class="category-btn" onclick="chooseDinner('Try Something New')">🌍 Try Something New</button>
    <p id="result"></p>
  </div>

  <script>
    let lang = "EN";

    const dinnerOptions = {
      "Fast Food": ["🍔 McDonald's", "🍕 Pizza Pizza", "☕ Tim Hortons", "🍔 Wendy's", "🍔 Hero", "🌮 Taco Bell", "🍗 Popeyes", "🥪 Subway", "🍗 KFC", "🍔 Five Guys"],
      "Try Something New": ["🥩 Asado", "🍖 Churrasco", "🔥 Carne Asada", "🥓 Yakitori / Yakiniku", "🍢 Moo Ping", "🍲 Laksa", "🍜 Bak Kut Teh", "🍝 Goulash", "🍜 Bún Riêu",
        "🍛 Butter Chicken + Basmati Rice", "🍚 Adobo", "🍚 Paella", "🍚 Koshari", "🍲 Seolleongtang", "🍲 Tom Kha Gai", "🍲 Borscht", "🍲 Bouillabaisse", "🧀 Fondue",
        "🥞 Crêpes", "🍠 Yaki-Imo", "🍩 Pastel de Nata", "🍞 Schnecken", "🐟 Hákarl", "🐑 Khorkhog", "🦆 Salted Duck", "🦘 Kangaroo Steak", "🥩 Bouzelouf", "🌶️🧄 Stinky Tofu", "🥔 Rösti"]
    };

    function chooseDinner(category = null) {
      let chosenCategory;

      if (category && dinnerOptions.hasOwnProperty(category)) {
        chosenCategory = category;
      } else {
        const allCategories = Object.keys(dinnerOptions);
        chosenCategory = allCategories[Math.floor(Math.random() * allCategories.length)];
      }

      const choices = dinnerOptions[chosenCategory];
      const dinnerChoice = choices[Math.floor(Math.random() * choices.length)];
      document.getElementById("result").innerText = lang === "EN" ? `Tonight's Pick: ${dinnerChoice}` : `今晚吃：${dinnerChoice}`;
    }

    function toggleMode() {
      const body = document.body;
      const isDark = body.classList.toggle("dark-mode");
      body.classList.toggle("light-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    function toggleLang() {
      lang = lang === "EN" ? "ZH" : "EN";
      document.getElementById("title").innerText = lang === "EN" ? "🍽️ What’s for Dinner?" : "🍽️ 今晚吃什麼？";
      document.getElementById("subtitle").innerText = lang === "EN" ? "Tap to randomly choose or pick a category:" : "點擊按鈕 隨機選擇 或選擇餐點類型：";
      document.querySelector(".random-btn").innerText = lang === "EN" ? "🎲 Random" : "🎲 隨機選擇";
      document.querySelectorAll(".category-btn")[0].innerText = lang === "EN" ? "🍔 Fast Food" : "🏪 速食";
      document.querySelectorAll(".category-btn")[1].innerText = lang === "EN" ? "🌍 Try Something New" : "🌍 試試新口味";
    }

    window.onload = function () {
      const savedTheme = localStorage.getItem("theme");
      const body = document.body;

      if (savedTheme === "light") {
        body.classList.remove("dark-mode");
        body.classList.add("light-mode");
      } else {
        body.classList.remove("light-mode");
        body.classList.add("dark-mode");
      }
    };
  </script>
</body>
</html>
